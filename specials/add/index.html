<style>
:root { --bg: #faf7f2; --card: #ffffff; --ink: #1c1917; --muted: #78716c; --line: #e7e5e4; --accent: #c2410c; }
@media (prefers-color-scheme: dark) {

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

li { margin-bottom: 4px; }
.frame { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
iframe { display: block; width: 100%; height: 1250px; border: 0; background: #fff; }
.fallback { font-size: 0.85rem; color: var(--muted); margin-top: 10px; }
